# Home Assistant Add-on manifest — SKELETON for Phase 2.
#
# This describes how Bobi Control Center will run as an add-on. It is not
# published yet, and while `adapter` is "mock" the add-on cannot read from or
# write to Home Assistant regardless of the permissions below.

name: Bobi Control Center
version: "1.0.0"
slug: bobi_control_center
description: מרכז הניהול של בובי — ניהול יכולות, מכשירים, אוטומציות ושעון שבת
url: https://github.com/inoncohen2/bobi-control-center

arch:
  - aarch64
  - amd64
  - armv7

# --- Ingress ---------------------------------------------------------------
# The UI is reached through Home Assistant's own authenticated proxy, so the
# add-on never exposes a port to the network and needs no login of its own.
ingress: true
ingress_port: 8000
panel_icon: mdi:robot-happy
panel_title: בובי
panel_admin: true

# No `ports:` mapping: Ingress is the only way in.

init: false
startup: application
boot: auto

# --- Home Assistant access (Phase 2) ---------------------------------------
# The Supervisor injects SUPERVISOR_TOKEN when these are true. Phase 1 does not
# use it: the mock adapter has no HTTP client at all.
hassio_api: true
homeassistant_api: true
auth_api: true

# The add-on's persistent configuration directory.
map:
  - config:rw

# --- User-visible options --------------------------------------------------
options:
  log_level: info
  adapter: mock

schema:
  log_level: list(debug|info|warning|error)
  # "real" is accepted by the schema so Phase 2 needs no manifest change, but
  # the backend still refuses it until RealHomeAssistantAdapter is implemented.
  adapter: list(mock|real)

# --- Health ----------------------------------------------------------------
watchdog: http://[HOST]:[PORT:8000]/health
