# Home Assistant App manifest for Bobi Control Center.
#
# Home Assistant access is server-side only. Management writes can reach only
# the explicit script.bobi_cc_* bridges and remain gated by the HA master switch
# plus Preview -> confirmation -> Commit -> HA validation -> verification.

name: Bobi Control Center
version: "3.21.0"
slug: bobi_control_center
description: מרכז הניהול של בובי — מכשירים, יכולות, שעון שבת, כללים חכמים ומרכז בדיקות
url: https://github.com/Inoncohen2/bobi-control-center

# `armv7` was dropped in 3.17.0: the Supervisor warns the value is deprecated,
# and emulating that platform in CI cost more build time than a platform nobody
# here runs. Home Assistant OS on a Pi 4 is `aarch64`.
arch:
  - aarch64
  - amd64

# --- Where the image comes from --------------------------------------------
# Naming an image is what stops the Supervisor building this app locally. It
# had been building it on every single release — two minutes of `docker buildx`
# on a Raspberry Pi 4, during which the Supervisor answers nothing, and which
# failed outright on 3.9.0. With this, an update is a pull.
#
# The Supervisor substitutes `{arch}` from the list above and appends the
# manifest `version` as the tag, so this must match what
# `.github/workflows/publish-image.yml` pushes, exactly. There is no
# local-build fallback once this key exists: a version whose image was never
# published cannot be installed at all. That workflow's `verify` job asserts
# the two agree, anonymously, before a release is considered done.
image: ghcr.io/inoncohen2/{arch}-addon-bobi_control_center

# --- Ingress ---------------------------------------------------------------
# The UI is reached only through Home Assistant's authenticated proxy. No
# `ports:` mapping, so nothing is exposed to the network.
ingress: true
ingress_port: 8099

# Sidebar entry. Note that `ingress_panel` is *not* a manifest key: the
# Supervisor owns it, it starts false, and the user turns it on with the
# "Show in sidebar" toggle on the app's page. These three keys are what make
# that toggle produce a good result — a named, icon-bearing panel.
panel_title: Bobi
panel_icon: mdi:robot-outline
# Restricts the sidebar entry to Home Assistant admins. Set to false to let
# every household member see it.
panel_admin: true

init: false
startup: application
boot: auto

# --- Home Assistant access -------------------------------------------------
# Grants SUPERVISOR_TOKEN so the backend can call the bridge scripts on
# http://supervisor/core/api. The token is read server-side only and never
# reaches the browser.
homeassistant_api: true

# Persistent app configuration.
map:
  - config:rw

# --- Options ---------------------------------------------------------------
options:
  log_level: info
  debug_http: false
  # External access stays fail-closed until both values are configured. The
  # password itself is never stored: only a salted scrypt hash is kept here.
  external_hostname: ""
  external_password_hash: ""
  external_role: admin

schema:
  log_level: list(debug|info|warning|error)
  # When true, logs bridge request/response bodies. Off by default so real
  # Home Assistant payloads are never written to the log in normal operation.
  debug_http: bool
  external_hostname: str?
  external_password_hash: password?
  # The role a session from the public hostname gets. Ingress is always
  # owner — Home Assistant has already authenticated an administrator.
  # `admin` by default: a session that crossed the Internet gets
  # everything except the operations rated destructive.
  external_role: list(viewer|operator|admin|owner)?

# --- Health ----------------------------------------------------------------
watchdog: http://[HOST]:[PORT:8099]/health
