# Bobi Control Center — production-shaped local run.
#
#   docker compose up --build     → http://localhost:8000
#
# One container serving both the API and the compiled UI, the same way the
# Home Assistant Add-on will run it.

services:
  bobi:
    build:
      context: .
      dockerfile: Dockerfile
    image: bobi-control-center:latest
    container_name: bobi-control-center
    ports:
      - '8000:8000'
    environment:
      # Phase 1 is mock-only. Setting this to "real" is not supported yet.
      BOBI_ADAPTER: mock
      BOBI_LOG_LEVEL: info
      BOBI_DATA_DIR: /data
    volumes:
      # Persistent configuration. Mirrors the add-on's /data mount.
      - bobi-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bobi-data:
